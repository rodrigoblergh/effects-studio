name: macOS native validation
on:
  push:
    branches: [macos-support]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  appkit:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build native Apple Silicon UI
        run: |
          test "$(uname -m)" = arm64
          cmake -S native/macOS/EffectStudio -B build/mac-ui -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build/mac-ui --parallel 3
      - name: Preserve development preview
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/mac-ui/EffectStudioMacPreview.app build/EffectStudioMacPreview.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Effect-Studio-Mac-UI-development-preview
          path: build/EffectStudioMacPreview.zip
          retention-days: 7
